# ============================================================
# Full Stack Aviation - Application Configuration
# ============================================================

# Server
server.port=8080
server.servlet.context-path=/api

# ============================================================
# Database - MySQL
# ============================================================
spring.datasource.url=jdbc:mysql://localhost:3306/horizon_airways?useSSL=false&serverTimezone=UTC&allowPublicKeyRetrieval=true
spring.datasource.username=root
spring.datasource.password=
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver

# ============================================================
# JPA / Hibernate
# ============================================================
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.MySQLDialect
spring.jpa.properties.hibernate.format_sql=true

# Seed data on startup
spring.sql.init.mode=always
spring.sql.init.data-locations=classpath:data.sql
spring.jpa.defer-datasource-initialization=true

# ============================================================
# JWT Configuration
# ============================================================
app.jwt.secret=ReplaceThisWithYourOwnBase64SecretKeyAtLeast256BitsLongForHS256Algorithm
app.jwt.expiration-ms=86400000

# ============================================================
# Email (Gmail SMTP)
# Fill in your Gmail address and App Password below.
# To get an App Password: Google Account → Security → 2-Step Verification → App passwords
# ============================================================
spring.mail.host=smtp.gmail.com
spring.mail.port=587
spring.mail.username=your_gmail@gmail.com
spring.mail.password=your_gmail_app_password
spring.mail.properties.mail.smtp.auth=true
spring.mail.properties.mail.smtp.starttls.enable=true
spring.mail.properties.mail.smtp.starttls.required=true

app.frontend.url=http://localhost:3000

# ============================================================
# Logging
# ============================================================
logging.level.com.horizon.airways=DEBUG
logging.level.org.springframework.security=INFO